schema_version: 1

context:
  name: gmailsorter
  version: "0.1.12"
  python_min: "3.12"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/gmailsorter-${{ version }}.tar.gz
  sha256: a18b80f8e616923d138603a6d840215cc4aac13726b4f458b62b7de21c6d8739

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - gmailsorter=gmailsorter.__main__:command_line_parser
      - gmailsorter-daemon=gmailsorter.daemon.__main__:command_line_parser
      - gmailsorter-app=gmailsorter.webapp.app:run_app

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - hatchling
    - hatch-vcs
  run:
    - python >=${{ python_min }}
    - google-api-python-client >=2.198.0
    - google-auth >=2.56.3
    - google-auth-oauthlib >=1.4.0
    - numpy >=2.5.1
    - tqdm >=4.70.0
    - pandas >=3.0.5
    - scikit-learn >=1.9.0
    - sqlalchemy >=2.0.51

tests:
  - python:
      imports:
        - gmailsorter
      pip_check: true
      python_version: 
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - gmailsorter --help
      - gmailsorter-daemon --help

about:
  summary: Assign labels to emails in Google Mail based on their similarity to other emails assigned to the same label.
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/jan-janssen/gmailsorter

extra:
  recipe-maintainers:
    - jan-janssen
