schema_version: 1

context:
  name: gmailsorter
  version: "0.2.1"
  python_min: '3.12'

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/gmailsorter-${{ version }}.tar.gz
  sha256: 880a3f39794a3a4f28768c9ce251c51391888c5dd5a5a145bbea0a6cac8a0301

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - gmailsorter=gmailsorter.__main__:command_line_parser
      - gmailsorter-daemon=gmailsorter.daemon.__main__:command_line_parser
      - gmailsorter-app=gmailsorter.webapp.app:run_app

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - hatchling
    - hatch-vcs
  run:
    - python >=${{ python_min }}
    - google-api-python-client >=2.201.0
    - google-auth >=2.60.0
    - google-auth-oauthlib >=1.5.0
    - sqlalchemy >=2.0.54
    - mailsort >=0.0.4
tests:
  - python:
      imports:
        - gmailsorter
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - '*'
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - gmailsorter --help
      - gmailsorter-daemon --help

about:
  summary: Assign labels to emails in Google Mail based on their similarity to other emails assigned to the same label.
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/jan-janssen/gmailsorter

extra:
  recipe-maintainers:
    - jan-janssen
