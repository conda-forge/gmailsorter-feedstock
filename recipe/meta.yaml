{% set name = "gmailsorter" %}
{% set version = "0.1.10" %}
{% set python_min = "3.11" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/gmailsorter-{{ version }}.tar.gz
  sha256: ca366ed0b489632314fc36b27f0f86c35e6e0dcc25df957184735d4be58d21e4

build:
  entry_points:
    - gmailsorter=gmailsorter.__main__:command_line_parser
    - gmailsorter-daemon=gmailsorter.daemon.__main__:command_line_parser
    - gmailsorter-app=gmailsorter.webapp.app:run_app
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
    - hatchling
    - hatch-vcs
  run:
    - python >={{ python_min }}
    - google-api-python-client >=2.194.0
    - google-auth >=2.49.2
    - google-auth-oauthlib >=1.3.1
    - numpy >=2.4.3
    - tqdm >=4.67.3
    - pandas >=3.0.2
    - scikit-learn >=1.8.0
    - sqlalchemy >=2.0.49

test:
  imports:
    - gmailsorter
  commands:
    - pip check
    - gmailsorter --help
    - gmailsorter-daemon --help
    # - gmailsorter-app --help
  requires:
    - pip
    # - flask <3
    # - flask-login
    # - werkzeug <3
    - python {{ python_min }}

about:
  home: https://github.com/jan-janssen/gmailsorter
  summary: Assign labels to emails in Google Mail based on their similarity to other emails assigned to the same label.
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - jan-janssen
